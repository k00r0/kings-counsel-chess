# The coach's AI helper. Free tier: Cloudflare Workers + Groq (free API key).
# Setup steps are in GUIDE.md ("Turn on the AI coach").
name = "kings-counsel-ai"
main = "src/index.js"
compatibility_date = "2026-09-01"

[ai]
binding = "AI"            # Cloudflare Workers AI: backup chat model + premium voice

[vars]
GROQ_MODEL = "openai/gpt-oss-120b"
FALLBACK_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
ALLOWED_ORIGINS = "capacitor://localhost,https://localhost,http://localhost,https://k00r0.github.io"

# Per-device burst limit (the app also enforces daily limits)
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 12, period = 60 }

# Secret (never put it in this file):  npx wrangler secret put GROQ_API_KEY
